<div id="resumen">
    <h2 i18n>{{ cuenta() | number }}<br>resultados.</h2>
    <h2 i18n>{{ mediana() | currency:'EUR' }}<br>mediana importe.</h2>
</div>
<hr>
<form (submit)="onSubmit($event)">
    <div>
        <h3>Resultados:</h3>
        <label for="">
            <input type="radio" value="perfil"
            [formField]="filterForm.results" i18n>
            Licitaciones.
        </label>
        <label for="">
            <input type="radio" value="competidores"
            [formField]="filterForm.results" i18n>
            Adjudicaciones.
        </label>
        <label for="">
            <input type="radio" value="todos"
            [formField]="filterForm.results" i18n>
            Todos.
        </label>
    </div>
    <div>
        <h3 i18n>Búsqueda:</h3>
        <select [formField]="filterForm.category">
            <option value="" i18n>Selecciona un campo...</option>
            @for (category of categories; track category.id) {
                <option [value]="category.name.toLocaleLowerCase()">{{ category.name }}</option>
            }
        </select>
        <input type="text" [formField]="filterForm.search" />
    </div>
    <div>
        <h3 i18n>Importe:</h3>
        <input type="number" [formField]="filterForm.minAmount" />
        <input type="number" [formField]="filterForm.maxAmount" />
    </div>
    <div>
        <h3 i18n>Fecha:</h3>
        <input type="date" [formField]="filterForm.minDate" />
        <input type="date" [formField]="filterForm.maxDate" />
    </div>
    <button type="submit" i18n>Filtrar</button>
</form>
<hr>
